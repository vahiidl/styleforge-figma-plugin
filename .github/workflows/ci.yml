name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly upstream-drift check: adapter golden tests fail if bundled
    # snapshots stop matching what the tests assert about upstream defaults.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
